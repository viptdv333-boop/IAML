<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IAML Brand Identity v7</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
body { margin: 0; background: #111; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { DesignCanvas, DCSection, DCArtboard } = window;

const C = {
  blue: '#003F87',
  sky: '#2E7ABF',
  skyL: '#6BADE0',
  gold: '#C5A44A',
  goldL: '#D9C27E',
  red: '#BC2026',
  ink: '#0A1628',
  white: '#FFFFFF',
  cream: '#F6F4EF',
  warmGray: '#E8E5DE',
  midGray: '#9CA3AF',
  dark: '#0A1628',
};

/* ═══════════════════════════════════════════════════════════════
   CONCEPT A: "THE INSTITUTIONAL SEAL"
   
   References: Harvard, Oxford, UN agencies, national academies.
   A proper circular seal communicates centuries of authority.
   
   Structure:
   — Outer ring with organization name
   — Inner geometric mark: a vertical line bisecting a circle, 
     with three precise horizontal strokes on the right —
     the essential DNA of Mongolian script (spine + teeth),
     rendered as pure geometry, not illustration.
   — Year of establishment
   — Gold accents for prestige
   ═══════════════════════════════════════════════════════════════ */
function SealMark({bg, size}) {
  const s = size || 1;
  const p = C.blue;
  const g = C.gold;
  const isD = bg === 'dark';
  const ring = isD ? C.skyL : p;
  const fill = isD ? C.white : p;
  return (
    <g>
      {/* Double outer ring */}
      <circle cx="120" cy="120" r="108" fill="none" stroke={ring} strokeWidth={2.8*s}/>
      <circle cx="120" cy="120" r="98" fill="none" stroke={ring} strokeWidth={0.8*s}/>
      
      {/* Circular text paths */}
      <defs>
        <path id={`sealTop-${bg}`} d="M 120,120 m -85,0 a 85,85 0 1,1 170,0"/>
        <path id={`sealBot-${bg}`} d="M 35,120 a 85,85 0 0,0 170,0"/>
      </defs>
      
      <text fontFamily="Cormorant Garamond,serif" fontSize={10*s} fontWeight="600" fill={fill} letterSpacing={3*s}>
        <textPath href={`#sealTop-${bg}`} startOffset="50%" textAnchor="middle">THE INTERNATIONAL ASSOCIATION FOR MONGOLIC LINGUISTICS</textPath>
      </text>
      
      <text fontFamily="DM Sans,sans-serif" fontSize={7.5*s} fontWeight="500" fill={g} letterSpacing={4*s}>
        <textPath href={`#sealBot-${bg}`} startOffset="50%" textAnchor="middle">FOUNDED 2026</textPath>
      </text>
      
      {/* Four cardinal dots on the ring */}
      <circle cx="120" cy="25" r={2*s} fill={g}/>
      <circle cx="120" cy="215" r={2*s} fill={g}/>
      <circle cx="25" cy="120" r={2*s} fill={g}/>
      <circle cx="215" cy="120" r={2*s} fill={g}/>
      
      {/* Inner mark — geometric script abstraction */}
      {/* Central vertical line — the spine */}
      <line x1="120" y1="52" x2="120" y2="188" stroke={fill} strokeWidth={4*s} strokeLinecap="round"/>
      
      {/* Three horizontal strokes — teeth, precisely spaced */}
      <line x1="120" y1="80" x2="148" y2="80" stroke={g} strokeWidth={3.5*s} strokeLinecap="round"/>
      <line x1="120" y1="114" x2="148" y2="114" stroke={g} strokeWidth={3.5*s} strokeLinecap="round"/>
      <line x1="120" y1="148" x2="148" y2="148" stroke={g} strokeWidth={3.5*s} strokeLinecap="round"/>
      
      {/* Left curve — belly (гэдэс), single smooth arc */}
      <path d="M 120,72 Q 96,97 120,122" fill="none" stroke={fill} strokeWidth={3*s} strokeLinecap="round"/>
      
      {/* Head circle */}
      <circle cx="120" cy="48" r={5*s} fill={fill}/>
    </g>
  );
}

function SealLockup({bg}) {
  const isD = bg === 'dark';
  const t = isD ? C.white : C.ink;
  const s = isD ? C.skyL : C.sky;
  return (
    <g>
      <g transform="scale(0.18) translate(-120,-120)">
        <g transform="translate(200,200)">
          <SealMark bg={bg} size={1}/>
        </g>
      </g>
      <line x1="60" y1="8" x2="60" y2="52" stroke={C.gold} strokeWidth="0.6" opacity="0.4"/>
      <text x="72" y="24" fontFamily="Cormorant Garamond,serif" fontSize="18" fontWeight="700" fill={t} letterSpacing="4">IAML</text>
      <text x="72" y="40" fontFamily="DM Sans,sans-serif" fontSize="5.5" fill={s} letterSpacing="1.8">THE INTERNATIONAL ASSOCIATION FOR MONGOLIC LINGUISTICS</text>
    </g>
  );
}


/* ═══════════════════════════════════════════════════════════════
   CONCEPT B: "THE VERTICAL MONOGRAM"
   
   The simplest, boldest concept. 
   
   IAML — four letters — stacked in a tall narrow blue rectangle,
   read top to bottom, like Mongolian script. The rectangle's 
   proportions (roughly 1:3) echo the shape of a traditional
   Mongolian text column.
   
   Typography does all the work: Cormorant Garamond at generous 
   size, gold letter-spacing lines, no decoration. The concept
   IS the vertical reading direction.
   
   Think: IBM's striped logo, but vertical.
   ═══════════════════════════════════════════════════════════════ */
function MonogramMark({bg}) {
  const isD = bg === 'dark';
  const bgRect = C.blue;
  const letterCol = C.white;
  const divCol = C.gold;
  return (
    <g>
      {/* The column */}
      <rect x="78" y="8" width="84" height="224" rx="6" fill={bgRect}/>
      
      {/* Letters — centered, evenly distributed */}
      <text x="120" y="60" textAnchor="middle" fontFamily="Cormorant Garamond,serif" fontSize="44" fontWeight="700" fill={letterCol} letterSpacing="0">I</text>
      <text x="120" y="112" textAnchor="middle" fontFamily="Cormorant Garamond,serif" fontSize="44" fontWeight="700" fill={letterCol} letterSpacing="0">A</text>
      <text x="120" y="164" textAnchor="middle" fontFamily="Cormorant Garamond,serif" fontSize="44" fontWeight="700" fill={letterCol} letterSpacing="0">M</text>
      <text x="120" y="216" textAnchor="middle" fontFamily="Cormorant Garamond,serif" fontSize="44" fontWeight="700" fill={letterCol} letterSpacing="0">L</text>
      
      {/* Gold divider lines */}
      <line x1="92" y1="72" x2="148" y2="72" stroke={divCol} strokeWidth="0.8" opacity="0.45"/>
      <line x1="92" y1="124" x2="148" y2="124" stroke={divCol} strokeWidth="0.8" opacity="0.45"/>
      <line x1="92" y1="176" x2="148" y2="176" stroke={divCol} strokeWidth="0.8" opacity="0.45"/>
    </g>
  );
}

function MonogramLockup({bg}) {
  const isD = bg === 'dark';
  const t = isD ? C.white : C.ink;
  const s = isD ? C.skyL : C.sky;
  return (
    <g>
      {/* Small monogram column */}
      <rect x="10" y="4" width="26" height="52" rx="3" fill={C.blue}/>
      <text x="23" y="17" textAnchor="middle" fontFamily="Cormorant Garamond,serif" fontSize="11" fontWeight="700" fill={C.white}>I</text>
      <text x="23" y="30" textAnchor="middle" fontFamily="Cormorant Garamond,serif" fontSize="11" fontWeight="700" fill={C.white}>A</text>
      <text x="23" y="43" textAnchor="middle" fontFamily="Cormorant Garamond,serif" fontSize="11" fontWeight="700" fill={C.white}>M</text>
      <text x="23" y="54.5" textAnchor="middle" fontFamily="Cormorant Garamond,serif" fontSize="11" fontWeight="700" fill={C.white}>L</text>
      
      <line x1="48" y1="8" x2="48" y2="52" stroke={C.gold} strokeWidth="0.6" opacity="0.4"/>
      
      <text x="58" y="24" fontFamily="Cormorant Garamond,serif" fontSize="16" fontWeight="700" fill={t} letterSpacing="3">The International Association</text>
      <text x="58" y="42" fontFamily="Cormorant Garamond,serif" fontSize="16" fontWeight="700" fill={t} letterSpacing="3">for Mongolic Linguistics</text>
    </g>
  );
}


/* ═══════════════════════════════════════════════════════════════
   CONCEPT C: "CRESCENT & CIRCLE"
   
   Abstracted from the Soyombo: a crescent (moon) cradling
   a circle (sun). These are Mongolia's most universal 
   celestial symbols — meaning "may the Mongolian people 
   live forever, like the eternal sun and moon."
   
   Rendered as pure, precise geometry. Two shapes. 
   The crescent is mathematically derived (circle minus 
   offset circle), not hand-drawn. The sun sits precisely 
   in the crescent's bowl.
   
   Below: a single thin gold line — the horizon of the steppe.
   
   This mark works at 12px or 12 meters.
   ═══════════════════════════════════════════════════════════════ */
function CrescentMark({bg}) {
  const isD = bg === 'dark';
  const p = isD ? C.skyL : C.blue;
  const g = C.gold;
  return (
    <g>
      {/* Crescent — mathematically constructed */}
      {/* Outer circle path minus inner offset circle */}
      <defs>
        <mask id={`crescMask-${bg}`}>
          <rect width="240" height="240" fill="white"/>
          <circle cx="120" cy="95" r="48" fill="black"/>
        </mask>
      </defs>
      <circle cx="120" cy="108" r="56" fill={p} mask={`url(#crescMask-${bg})`}/>
      
      {/* Sun circle — sits in the crescent's bowl */}
      <circle cx="120" cy="80" r="16" fill={g}/>
      
      {/* Horizon line */}
      <line x1="52" y1="185" x2="188" y2="185" stroke={g} strokeWidth="1.2" opacity="0.5"/>
      
      {/* Full org name centered below */}
      <text x="120" y="205" textAnchor="middle" fontFamily="DM Sans,sans-serif" fontSize="7" fill={p} letterSpacing="3.5" fontWeight="500">IAML</text>
    </g>
  );
}

function CrescentLockup({bg}) {
  const isD = bg === 'dark';
  const p = isD ? C.skyL : C.blue;
  const t = isD ? C.white : C.ink;
  const s = isD ? C.skyL : C.sky;
  const g = C.gold;
  return (
    <g>
      {/* Compact crescent + sun */}
      <defs>
        <mask id={`crescSmall-${bg}`}>
          <rect width="600" height="100" fill="white"/>
          <circle cx="28" cy="22" r="18" fill="black"/>
        </mask>
      </defs>
      <circle cx="28" cy="30" r="22" fill={p} mask={`url(#crescSmall-${bg})`}/>
      <circle cx="28" cy="18" r="7" fill={g}/>
      
      <line x1="60" y1="8" x2="60" y2="52" stroke={g} strokeWidth="0.6" opacity="0.4"/>
      
      <text x="72" y="24" fontFamily="Cormorant Garamond,serif" fontSize="18" fontWeight="700" fill={t} letterSpacing="4">IAML</text>
      <text x="72" y="40" fontFamily="DM Sans,sans-serif" fontSize="5.5" fill={s} letterSpacing="1.8">THE INTERNATIONAL ASSOCIATION FOR MONGOLIC LINGUISTICS</text>
    </g>
  );
}


/* ═══════════════════════════════════════════════════════════════
   APPLICATION MOCKUPS
   ═══════════════════════════════════════════════════════════════ */

function Letterhead({ mark, bg }) {
  return (
    <div style={{
      width: 280, height: 380, background: C.white,
      boxShadow: '0 2px 16px rgba(0,0,0,0.1)',
      borderRadius: 4, padding: 24,
      display: 'flex', flexDirection: 'column',
      fontFamily: 'DM Sans, sans-serif',
      position: 'relative',
    }}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16}}>
        <svg viewBox="0 0 240 240" width="32" height="32">{mark}</svg>
        <div>
          <div style={{fontSize:8,fontWeight:700,color:C.blue,letterSpacing:2}}>IAML</div>
          <div style={{fontSize:5,color:C.midGray,letterSpacing:1}}>International Association for Mongolic Linguistics</div>
        </div>
      </div>
      <div style={{width:'100%',height:0.5,background:C.gold,opacity:0.4,marginBottom:16}}></div>
      {/* Body lines */}
      {[100,90,95,60,100,85,70,95,100,80,65].map((w,i) => (
        <div key={i} style={{width:`${w}%`,height:3,background:C.warmGray,marginBottom:6,borderRadius:1}}></div>
      ))}
      {/* Footer */}
      <div style={{marginTop:'auto',paddingTop:12,borderTop:`0.5px solid ${C.warmGray}`}}>
        <div style={{fontSize:4.5,color:C.midGray,letterSpacing:0.5}}>P.O. Box 1234 · Ulaanbaatar, Mongolia · iaml.org</div>
      </div>
    </div>
  );
}

function ConferenceBadge({ mark }) {
  return (
    <div style={{
      width: 200, height: 280, background: C.white,
      boxShadow: '0 2px 16px rgba(0,0,0,0.1)',
      borderRadius: 8, overflow: 'hidden',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center',
      fontFamily: 'DM Sans, sans-serif',
    }}>
      {/* Top blue bar */}
      <div style={{width:'100%',height:8,background:C.blue}}></div>
      <div style={{padding:'16px 16px 0',display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
        <svg viewBox="0 0 240 240" width="44" height="44">{mark}</svg>
        <div style={{fontSize:7,fontWeight:600,color:C.blue,letterSpacing:2,textTransform:'uppercase'}}>IAML 2026</div>
        <div style={{fontSize:5,color:C.gold,letterSpacing:1}}>ULAANBAATAR · MONGOLIA</div>
      </div>
      <div style={{width:120,height:0.5,background:C.gold,opacity:0.4,margin:'12px 0'}}></div>
      {/* Name area */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4,padding:'0 16px'}}>
        <div style={{width:80,height:80,borderRadius:40,background:C.warmGray}}></div>
        <div style={{fontSize:11,fontWeight:700,color:C.ink,marginTop:4}}>Dr. Name Surname</div>
        <div style={{fontSize:7,color:C.midGray,textAlign:'center'}}>University of Helsinki<br/>Department of Linguistics</div>
      </div>
      <div style={{marginTop:'auto',width:'100%',height:4,background:C.gold,opacity:0.6}}></div>
    </div>
  );
}

function JournalCover({ mark }) {
  return (
    <div style={{
      width: 240, height: 340, background: C.blue,
      boxShadow: '0 2px 16px rgba(0,0,0,0.2)',
      borderRadius: 4, overflow: 'hidden',
      display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center',
      fontFamily: 'Cormorant Garamond, serif',
      position: 'relative', padding: 24,
    }}>
      {/* Subtle border */}
      <div style={{position:'absolute',inset:8,border:`0.5px solid ${C.gold}`,opacity:0.25,borderRadius:2,pointerEvents:'none'}}></div>
      
      <svg viewBox="0 0 240 240" width="72" height="72">{mark}</svg>
      <div style={{width:60,height:0.5,background:C.gold,opacity:0.5,margin:'16px 0'}}></div>
      <div style={{fontSize:18,fontWeight:600,color:C.white,textAlign:'center',lineHeight:1.3,letterSpacing:1}}>
        Journal of<br/>Mongolic<br/>Linguistics
      </div>
      <div style={{fontSize:8,color:C.goldL,marginTop:12,letterSpacing:3}}>VOL. I · 2026</div>
      <div style={{fontSize:7,color:C.skyL,marginTop:8,letterSpacing:1,fontFamily:'DM Sans,sans-serif',opacity:0.7}}>IAML</div>
    </div>
  );
}


/* ═══════════════════════════════════════════════════════════════
   BRAND PRESENTATION SHEET
   ═══════════════════════════════════════════════════════════════ */
function BrandPresentation({ markFn, lockupFn, name, rationale, children }) {
  return (
    <div style={{
      display:'flex', flexDirection:'column', width:960, 
      fontFamily:'DM Sans,sans-serif', background:C.cream,
    }}>
      {/* Hero: Mark on light + dark */}
      <div style={{display:'flex',height:340}}>
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:C.white}}>
          <svg viewBox="0 0 240 240" width="240" height="240">{markFn('light')}</svg>
        </div>
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:C.dark}}>
          <svg viewBox="0 0 240 240" width="240" height="240">{markFn('dark')}</svg>
        </div>
      </div>
      
      {/* Lockup: light + dark */}
      <div style={{display:'flex',height:80}}>
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:C.cream,padding:'0 40px'}}>
          <svg viewBox="0 0 400 60" width="380" height="56">{lockupFn('light')}</svg>
        </div>
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:C.ink,padding:'0 40px'}}>
          <svg viewBox="0 0 400 60" width="380" height="56">{lockupFn('dark')}</svg>
        </div>
      </div>
      
      {/* Applications row */}
      <div style={{
        display:'flex', gap:20, padding:'28px 32px',
        alignItems:'flex-end', justifyContent:'center',
        background:C.warmGray,
      }}>
        <Letterhead mark={markFn('light')} />
        <ConferenceBadge mark={markFn('light')} />
        <JournalCover mark={markFn('dark')} />
      </div>
      
      {/* Rationale */}
      <div style={{
        padding:'20px 40px', background:C.cream,
        borderTop:`1px solid ${C.warmGray}`,
        display:'flex', gap:32, alignItems:'baseline',
      }}>
        <span style={{fontSize:14,fontWeight:700,color:C.blue,letterSpacing:2,textTransform:'uppercase',whiteSpace:'nowrap'}}>{name}</span>
        <span style={{fontSize:12,color:'#6B7280',lineHeight:1.5}}>{rationale}</span>
      </div>
    </div>
  );
}


function App() {
  const sealMarkFn = (bg) => <SealMark bg={bg} size={1}/>;
  const sealLockupFn = (bg) => <SealLockup bg={bg}/>;
  
  const monoMarkFn = (bg) => <MonogramMark bg={bg}/>;
  const monoLockupFn = (bg) => <MonogramLockup bg={bg}/>;
  
  const crescMarkFn = (bg) => <CrescentMark bg={bg}/>;
  const crescLockupFn = (bg) => <CrescentLockup bg={bg}/>;

  return (
    <DesignCanvas title="IAML — Brand Identity Proposal" subtitle="Three directions · mark, lockup, and applications">
      <DCSection id="concepts" title="Concepts">
        <DCArtboard id="seal" label="A — The Institutional Seal" width={960} height={920}>
          <BrandPresentation
            markFn={sealMarkFn}
            lockupFn={sealLockupFn}
            name="THE SEAL"
            rationale="A proper institutional seal in the tradition of world-class academies. The inner mark abstracts the DNA of Mongolian vertical script — spine, teeth, belly curve — into pure geometry. Four cardinal gold dots anchor the composition. Circular text establishes authority and permanence."
          />
        </DCArtboard>
        
        <DCArtboard id="monogram" label="B — The Vertical Monogram" width={960} height={920}>
          <BrandPresentation
            markFn={monoMarkFn}
            lockupFn={monoLockupFn}
            name="THE MONOGRAM"
            rationale="IAML stacked vertically like Mongolian script reads — top to bottom. The tall column proportions echo a traditional text column. Typography does all the work: no decoration, no illustration. The reading direction itself IS the cultural statement. Bold, modern, unmistakable."
          />
        </DCArtboard>
        
        <DCArtboard id="crescent" label="C — Crescent & Sun" width={960} height={920}>
          <BrandPresentation
            markFn={crescMarkFn}
            lockupFn={crescLockupFn}
            name="CRESCENT & SUN"
            rationale="The moon cradling the sun — Mongolia's most ancient celestial symbol, from the Soyombo. Mathematically constructed crescent (circle minus offset circle), not hand-drawn. Two shapes, absolute precision. 'May the Mongolian people live forever, like the eternal sun and moon.'"
          />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script>window.IAML_LOGO_PAGE_SLUG='logo-v7';</script><script src="voting.js" defer></script>
<script src="responsive-canvas.js" defer></script>
</body>
</html>
