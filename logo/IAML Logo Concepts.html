<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IAML Logo Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Archivo:wght@400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  body { margin:0; background:#1a1a1a; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ======================================================
   IAML LOGO CONCEPTS
   The International Association for Mongolic Linguistics
   
   Color palette:
   - Deep blue (Mongolia flag): #003F87
   - Eternal Blue Sky:          #2E7ABF
   - Sky blue light:            #5BA3D9
   - Gold accent:               #D4A843
   - Rich red (flag):           #BC2026
   - Ivory:                     #F5F0E8
   ====================================================== */

const { DesignCanvas, DCSection, DCArtboard } = window;

/* --- Concept 1: Academic Circular Seal --- */
function Logo1() {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',width:600,height:500,background:'#ffffff'}}>
      <svg viewBox="0 0 400 400" width="320" height="320">
        {/* Outer ring */}
        <circle cx="200" cy="200" r="185" fill="none" stroke="#003F87" strokeWidth="3"/>
        <circle cx="200" cy="200" r="170" fill="none" stroke="#003F87" strokeWidth="1.5"/>
        
        {/* Text along circular path */}
        <defs>
          <path id="topArc" d="M 200,200 m -155,0 a 155,155 0 1,1 310,0" />
          <path id="bottomArcFlip" d="M 45,200 a 155,155 0 0,0 310,0" />
        </defs>
        <text fontFamily="Cormorant Garamond, serif" fontSize="13" fontWeight="600" fill="#003F87" letterSpacing="2.5">
          <textPath href="#topArc" startOffset="50%" textAnchor="middle">INTERNATIONAL ASSOCIATION FOR MONGOLIC LINGUISTICS</textPath>
        </text>
        <text fontFamily="DM Sans, sans-serif" fontSize="11" fill="#003F87" letterSpacing="2">
          <textPath href="#bottomArcFlip" startOffset="50%" textAnchor="middle">★  EST. MMXXVI  ★</textPath>
        </text>
        
        {/* Center monogram */}
        <text x="200" y="195" textAnchor="middle" fontFamily="Cormorant Garamond, serif" fontSize="72" fontWeight="700" fill="#003F87" letterSpacing="6">IAML</text>
        
        {/* Decorative lines */}
        <line x1="120" y1="215" x2="280" y2="215" stroke="#D4A843" strokeWidth="1.5"/>
        <line x1="140" y1="222" x2="260" y2="222" stroke="#D4A843" strokeWidth="0.8"/>
        
        {/* Small decorative dots */}
        <circle cx="115" cy="215" r="3" fill="#D4A843"/>
        <circle cx="285" cy="215" r="3" fill="#D4A843"/>
        
        {/* Vertical script-inspired element in center top */}
        <g transform="translate(200,110)">
          <line x1="0" y1="-25" x2="0" y2="25" stroke="#003F87" strokeWidth="2"/>
          <circle cx="0" cy="-28" r="3" fill="#003F87"/>
          <line x1="-6" y1="-15" x2="0" y2="-10" stroke="#003F87" strokeWidth="1.5"/>
          <line x1="6" y1="-5" x2="0" y2="0" stroke="#003F87" strokeWidth="1.5"/>
        </g>
      </svg>
      <p style={{fontFamily:'DM Sans, sans-serif',fontSize:11,color:'#888',marginTop:12,letterSpacing:2,textTransform:'uppercase'}}>Concept 1 — Academic Seal</p>
    </div>
  );
}

/* --- Concept 2: Eternal Blue Sky — Arc + Wordmark --- */
function Logo2() {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',width:600,height:500,background:'#ffffff'}}>
      <svg viewBox="0 0 440 260" width="420" height="250">
        {/* Sky arc gradient */}
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#5BA3D9"/>
            <stop offset="100%" stopColor="#003F87"/>
          </linearGradient>
        </defs>
        
        {/* Arc representing the Eternal Blue Sky */}
        <path d="M 100,130 Q 220,30 340,130" fill="none" stroke="url(#skyGrad)" strokeWidth="4" strokeLinecap="round"/>
        <path d="M 120,130 Q 220,50 320,130" fill="none" stroke="url(#skyGrad)" strokeWidth="2" opacity="0.4" strokeLinecap="round"/>
        
        {/* Gold circle — sun/celestial */}
        <circle cx="220" cy="85" r="10" fill="#D4A843"/>
        <circle cx="220" cy="85" r="14" fill="none" stroke="#D4A843" strokeWidth="0.8" opacity="0.5"/>
        
        {/* Main text */}
        <text x="220" y="170" textAnchor="middle" fontFamily="Cormorant Garamond, serif" fontSize="52" fontWeight="700" fill="#003F87" letterSpacing="10">IAML</text>
        
        {/* Subtitle */}
        <text x="220" y="198" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="10.5" fill="#2E7ABF" letterSpacing="3.5">THE INTERNATIONAL ASSOCIATION</text>
        <text x="220" y="215" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="10.5" fill="#2E7ABF" letterSpacing="3.5">FOR MONGOLIC LINGUISTICS</text>
      </svg>
      <p style={{fontFamily:'DM Sans, sans-serif',fontSize:11,color:'#888',marginTop:12,letterSpacing:2,textTransform:'uppercase'}}>Concept 2 — Eternal Blue Sky</p>
    </div>
  );
}

/* --- Concept 3: Vertical Script Accent --- */
function Logo3() {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',width:600,height:500,background:'#ffffff'}}>
      <svg viewBox="0 0 460 240" width="440" height="230">
        {/* Vertical Mongolian script-inspired line on the left */}
        <g transform="translate(60,20)">
          <line x1="0" y1="0" x2="0" y2="200" stroke="#2E7ABF" strokeWidth="2.5"/>
          {/* Script-like flourishes */}
          <circle cx="0" cy="8" r="5" fill="#2E7ABF"/>
          <path d="M 0,30 Q -12,42 0,55" fill="none" stroke="#2E7ABF" strokeWidth="2" strokeLinecap="round"/>
          <path d="M 0,70 Q 10,82 0,95" fill="none" stroke="#2E7ABF" strokeWidth="2" strokeLinecap="round"/>
          <path d="M 0,110 Q -8,118 -4,128 Q 0,138 0,145" fill="none" stroke="#2E7ABF" strokeWidth="2" strokeLinecap="round"/>
          <circle cx="-4" cy="128" r="2" fill="#2E7ABF"/>
          <path d="M 0,160 Q 8,170 0,180" fill="none" stroke="#2E7ABF" strokeWidth="2" strokeLinecap="round"/>
          <line x1="-4" y1="200" x2="4" y2="200" stroke="#2E7ABF" strokeWidth="2" strokeLinecap="round"/>
        </g>
        
        {/* Main wordmark */}
        <text x="100" y="110" fontFamily="Libre Baskerville, serif" fontSize="64" fontWeight="700" fill="#003F87" letterSpacing="8">IAML</text>
        
        {/* Gold separator */}
        <line x1="100" y1="130" x2="370" y2="130" stroke="#D4A843" strokeWidth="1"/>
        
        {/* Full name */}
        <text x="100" y="155" fontFamily="DM Sans, sans-serif" fontSize="11" fill="#5BA3D9" letterSpacing="2.5">THE INTERNATIONAL ASSOCIATION</text>
        <text x="100" y="173" fontFamily="DM Sans, sans-serif" fontSize="11" fill="#5BA3D9" letterSpacing="2.5">FOR MONGOLIC LINGUISTICS</text>
      </svg>
      <p style={{fontFamily:'DM Sans, sans-serif',fontSize:11,color:'#888',marginTop:12,letterSpacing:2,textTransform:'uppercase'}}>Concept 3 — Script Accent</p>
    </div>
  );
}

/* --- Concept 4: Geometric Mark + Wordmark --- */
function Logo4() {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',width:600,height:500,background:'#ffffff'}}>
      <svg viewBox="0 0 480 220" width="460" height="210">
        {/* Geometric mark — interlocking pattern inspired by Mongolian knot */}
        <g transform="translate(70,40)">
          <rect x="0" y="0" width="55" height="55" rx="4" fill="none" stroke="#003F87" strokeWidth="3"/>
          <rect x="18" y="18" width="55" height="55" rx="4" fill="none" stroke="#2E7ABF" strokeWidth="3"/>
          <rect x="36" y="36" width="55" height="55" rx="4" fill="none" stroke="#5BA3D9" strokeWidth="3"/>
          {/* Gold diamond accent at intersection */}
          <rect x="34" y="34" width="14" height="14" rx="1" fill="#D4A843" transform="rotate(45,41,41)"/>
        </g>
        
        {/* Wordmark */}
        <text x="195" y="78" fontFamily="Archivo, sans-serif" fontSize="54" fontWeight="800" fill="#003F87" letterSpacing="6">IAML</text>
        
        {/* Separator */}
        <rect x="195" y="92" width="50" height="3" rx="1.5" fill="#D4A843"/>
        
        {/* Full name */}
        <text x="195" y="116" fontFamily="DM Sans, sans-serif" fontSize="11" fill="#2E7ABF" letterSpacing="2">INTERNATIONAL ASSOCIATION FOR</text>
        <text x="195" y="134" fontFamily="DM Sans, sans-serif" fontSize="11" fill="#2E7ABF" letterSpacing="2">MONGOLIC LINGUISTICS</text>
      </svg>
      <p style={{fontFamily:'DM Sans, sans-serif',fontSize:11,color:'#888',marginTop:12,letterSpacing:2,textTransform:'uppercase'}}>Concept 4 — Geometric Knot</p>
    </div>
  );
}

/* --- Concept 5: Monogram Badge --- */
function Logo5() {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',width:600,height:500,background:'#ffffff'}}>
      <svg viewBox="0 0 360 360" width="300" height="300">
        <defs>
          <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor="#003F87"/>
            <stop offset="100%" stopColor="#2E7ABF"/>
          </linearGradient>
        </defs>
        
        {/* Badge background */}
        <rect x="60" y="40" width="240" height="240" rx="20" fill="url(#badgeGrad)"/>
        
        {/* Inner border */}
        <rect x="75" y="55" width="210" height="210" rx="14" fill="none" stroke="#ffffff" strokeWidth="1" opacity="0.3"/>
        
        {/* IAML letters in grid */}
        <text x="130" y="145" textAnchor="middle" fontFamily="Cormorant Garamond, serif" fontSize="62" fontWeight="700" fill="#ffffff" opacity="0.95">I</text>
        <text x="230" y="145" textAnchor="middle" fontFamily="Cormorant Garamond, serif" fontSize="62" fontWeight="700" fill="#ffffff" opacity="0.95">A</text>
        <text x="130" y="225" textAnchor="middle" fontFamily="Cormorant Garamond, serif" fontSize="62" fontWeight="700" fill="#ffffff" opacity="0.95">M</text>
        <text x="230" y="225" textAnchor="middle" fontFamily="Cormorant Garamond, serif" fontSize="62" fontWeight="700" fill="#ffffff" opacity="0.95">L</text>
        
        {/* Cross dividers */}
        <line x1="180" y1="75" x2="180" y2="245" stroke="#D4A843" strokeWidth="1" opacity="0.6"/>
        <line x1="95" y1="165" x2="265" y2="165" stroke="#D4A843" strokeWidth="1" opacity="0.6"/>
        
        {/* Gold diamond at center */}
        <rect x="174" y="159" width="12" height="12" fill="#D4A843" transform="rotate(45,180,165)"/>
        
        {/* Full name below */}
        <text x="180" y="310" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="10" fill="#003F87" letterSpacing="2.5">INTERNATIONAL ASSOCIATION</text>
        <text x="180" y="326" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="10" fill="#003F87" letterSpacing="2.5">FOR MONGOLIC LINGUISTICS</text>
      </svg>
      <p style={{fontFamily:'DM Sans, sans-serif',fontSize:11,color:'#888',marginTop:12,letterSpacing:2,textTransform:'uppercase'}}>Concept 5 — Monogram Badge</p>
    </div>
  );
}

/* --- Concept 6: Steppe Horizon --- */
function Logo6() {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',width:600,height:500,background:'#ffffff'}}>
      <svg viewBox="0 0 500 240" width="480" height="230">
        {/* Sky gradient band */}
        <defs>
          <linearGradient id="horizonGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#5BA3D9"/>
            <stop offset="60%" stopColor="#2E7ABF"/>
            <stop offset="100%" stopColor="#003F87"/>
          </linearGradient>
        </defs>
        
        {/* Horizontal band */}
        <rect x="30" y="85" width="440" height="6" rx="3" fill="url(#horizonGrad)"/>
        <rect x="60" y="95" width="380" height="2" rx="1" fill="#5BA3D9" opacity="0.3"/>
        
        {/* Main text above horizon */}
        <text x="250" y="75" textAnchor="middle" fontFamily="Playfair Display, serif" fontSize="56" fontWeight="700" fill="#003F87" letterSpacing="12">IAML</text>
        
        {/* Full name below horizon */}
        <text x="250" y="128" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="10.5" fill="#2E7ABF" letterSpacing="4">THE INTERNATIONAL ASSOCIATION</text>
        <text x="250" y="146" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="10.5" fill="#2E7ABF" letterSpacing="4">FOR MONGOLIC LINGUISTICS</text>
        
        {/* Small gold sun on horizon */}
        <circle cx="250" cy="88" r="5" fill="#D4A843"/>
      </svg>
      <p style={{fontFamily:'DM Sans, sans-serif',fontSize:11,color:'#888',marginTop:12,letterSpacing:2,textTransform:'uppercase'}}>Concept 6 — Steppe Horizon</p>
    </div>
  );
}

/* --- Concept 7: Shield Crest --- */
function Logo7() {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',width:600,height:500,background:'#ffffff'}}>
      <svg viewBox="0 0 320 400" width="260" height="330">
        {/* Shield shape */}
        <path d="M 160,20 L 280,60 L 280,200 Q 280,310 160,360 Q 40,310 40,200 L 40,60 Z" fill="none" stroke="#003F87" strokeWidth="3"/>
        <path d="M 160,35 L 268,70 L 268,200 Q 268,298 160,345 Q 52,298 52,200 L 52,70 Z" fill="#003F87" opacity="0.04"/>
        
        {/* Inner shield border */}
        <path d="M 160,45 L 260,78 L 260,198 Q 260,290 160,332 Q 60,290 60,198 L 60,78 Z" fill="none" stroke="#003F87" strokeWidth="1" opacity="0.3"/>
        
        {/* Horizontal divider */}
        <line x1="80" y1="175" x2="240" y2="175" stroke="#D4A843" strokeWidth="1.5"/>
        
        {/* IAML text */}
        <text x="160" y="150" textAnchor="middle" fontFamily="Cormorant Garamond, serif" fontSize="52" fontWeight="700" fill="#003F87" letterSpacing="6">IAML</text>
        
        {/* Subtitle in shield */}
        <text x="160" y="205" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="9" fill="#2E7ABF" letterSpacing="2">INTERNATIONAL</text>
        <text x="160" y="220" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="9" fill="#2E7ABF" letterSpacing="2">ASSOCIATION FOR</text>
        <text x="160" y="235" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="9" fill="#2E7ABF" letterSpacing="2">MONGOLIC</text>
        <text x="160" y="250" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="9" fill="#2E7ABF" letterSpacing="2">LINGUISTICS</text>
        
        {/* Top decorative element — vertical line like script */}
        <g transform="translate(160,70)">
          <circle cx="0" cy="0" r="4" fill="#D4A843"/>
          <line x1="0" y1="6" x2="0" y2="30" stroke="#D4A843" strokeWidth="1.5"/>
          <line x1="-5" y1="18" x2="0" y2="14" stroke="#D4A843" strokeWidth="1"/>
          <line x1="5" y1="24" x2="0" y2="20" stroke="#D4A843" strokeWidth="1"/>
        </g>
        
        {/* Bottom gold accent */}
        <circle cx="160" cy="290" r="4" fill="#D4A843"/>
        <line x1="140" y1="290" x2="155" y2="290" stroke="#D4A843" strokeWidth="1"/>
        <line x1="165" y1="290" x2="180" y2="290" stroke="#D4A843" strokeWidth="1"/>
      </svg>
      <p style={{fontFamily:'DM Sans, sans-serif',fontSize:11,color:'#888',marginTop:12,letterSpacing:2,textTransform:'uppercase'}}>Concept 7 — Shield Crest</p>
    </div>
  );
}

/* --- Concept 8: Dark Variant — Reversed on Deep Blue --- */
function Logo8() {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',width:600,height:500,background:'#00264D'}}>
      <svg viewBox="0 0 440 280" width="420" height="268">
        {/* Outer frame */}
        <rect x="20" y="20" width="400" height="240" rx="0" fill="none" stroke="#5BA3D9" strokeWidth="1" opacity="0.3"/>
        
        {/* Thin double line top */}
        <line x1="60" y1="60" x2="380" y2="60" stroke="#D4A843" strokeWidth="0.8"/>
        <line x1="60" y1="64" x2="380" y2="64" stroke="#D4A843" strokeWidth="0.5" opacity="0.5"/>
        
        {/* Main IAML */}
        <text x="220" y="140" textAnchor="middle" fontFamily="Playfair Display, serif" fontSize="68" fontWeight="600" fill="#ffffff" letterSpacing="18">IAML</text>
        
        {/* Thin double line bottom */}
        <line x1="60" y1="160" x2="380" y2="160" stroke="#D4A843" strokeWidth="0.8"/>
        <line x1="60" y1="164" x2="380" y2="164" stroke="#D4A843" strokeWidth="0.5" opacity="0.5"/>
        
        {/* Full name */}
        <text x="220" y="192" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="10.5" fill="#5BA3D9" letterSpacing="4.5">THE INTERNATIONAL ASSOCIATION</text>
        <text x="220" y="210" textAnchor="middle" fontFamily="DM Sans, sans-serif" fontSize="10.5" fill="#5BA3D9" letterSpacing="4.5">FOR MONGOLIC LINGUISTICS</text>
        
        {/* Vertical script accent — left */}
        <g transform="translate(40,70)">
          <line x1="0" y1="0" x2="0" y2="140" stroke="#5BA3D9" strokeWidth="1.2" opacity="0.4"/>
          <circle cx="0" cy="0" r="2.5" fill="#D4A843"/>
          <circle cx="0" cy="140" r="2.5" fill="#D4A843"/>
        </g>
        
        {/* Vertical script accent — right */}
        <g transform="translate(400,70)">
          <line x1="0" y1="0" x2="0" y2="140" stroke="#5BA3D9" strokeWidth="1.2" opacity="0.4"/>
          <circle cx="0" cy="0" r="2.5" fill="#D4A843"/>
          <circle cx="0" cy="140" r="2.5" fill="#D4A843"/>
        </g>
      </svg>
      <p style={{fontFamily:'DM Sans, sans-serif',fontSize:11,color:'#5BA3D9',marginTop:12,letterSpacing:2,textTransform:'uppercase'}}>Concept 8 — Dark / Reversed</p>
    </div>
  );
}

/* ====================== MAIN APP ====================== */
function App() {
  return (
    <DesignCanvas title="IAML — Logo Concepts" subtitle="The International Association for Mongolic Linguistics · 8 variations">
      <DCSection id="seals" title="Seal & Emblem">
        <DCArtboard id="logo1" label="Academic Seal" width={600} height={500}>
          <Logo1 />
        </DCArtboard>
        <DCArtboard id="logo5" label="Monogram Badge" width={600} height={500}>
          <Logo5 />
        </DCArtboard>
        <DCArtboard id="logo7" label="Shield Crest" width={600} height={500}>
          <Logo7 />
        </DCArtboard>
      </DCSection>

      <DCSection id="wordmarks" title="Wordmark & Horizontal">
        <DCArtboard id="logo2" label="Eternal Blue Sky" width={600} height={500}>
          <Logo2 />
        </DCArtboard>
        <DCArtboard id="logo3" label="Script Accent" width={600} height={500}>
          <Logo3 />
        </DCArtboard>
        <DCArtboard id="logo6" label="Steppe Horizon" width={600} height={500}>
          <Logo6 />
        </DCArtboard>
      </DCSection>

      <DCSection id="geometric" title="Geometric & Dark">
        <DCArtboard id="logo4" label="Geometric Knot" width={600} height={500}>
          <Logo4 />
        </DCArtboard>
        <DCArtboard id="logo8" label="Dark / Reversed" width={600} height={500}>
          <Logo8 />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script>window.IAML_LOGO_PAGE_SLUG='concepts';</script><script src="voting.js" defer></script>
<script src="responsive-canvas.js" defer></script>
</body>
</html>
