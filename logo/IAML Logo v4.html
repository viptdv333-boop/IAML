<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IAML Logo v4 — Color Marks</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700;800;900&family=Libre+Baskerville:wght@400;700&family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<style>
  body { margin:0; background:#1a1a1a; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { DesignCanvas, DCSection, DCArtboard } = window;

/* ═══════════════════════════════════════
   IAML LOGO v4
   Colors of Mongolia flag & sky:
   - Deep Blue:    #003F87
   - Sky Blue:     #2E7ABF  
   - Light Sky:    #5BA3D9
   - Red:          #BC2026
   - Gold:         #D4A843
   ═══════════════════════════════════════ */

const C = {
  deepBlue: '#003F87',
  skyBlue: '#2E7ABF',
  lightSky: '#5BA3D9',
  red: '#BC2026',
  gold: '#D4A843',
  dark: '#0F172A',
  light: '#F8FAFC',
};

/* Dual preview — light and dark side by side */
function Dual({ children, label }) {
  return (
    <div style={{display:'flex',flexDirection:'column',width:640,height:540}}>
      <div style={{display:'flex',flex:1}}>
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#ffffff',gap:14,padding:24}}>
          <svg viewBox="0 0 200 200" width="140" height="140">
            {children('light')}
          </svg>
          <span style={{fontFamily:'DM Sans,sans-serif',fontSize:13,fontWeight:600,letterSpacing:2.5,color:C.deepBlue}}>IAML</span>
        </div>
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:C.dark,gap:14,padding:24}}>
          <svg viewBox="0 0 200 200" width="140" height="140">
            {children('dark')}
          </svg>
          <span style={{fontFamily:'DM Sans,sans-serif',fontSize:13,fontWeight:600,letterSpacing:2.5,color:C.light}}>IAML</span>
        </div>
      </div>
      <div style={{display:'flex',height:38,alignItems:'center',justifyContent:'center',background:'#F1F5F9'}}>
        <span style={{fontFamily:'DM Sans,sans-serif',fontSize:11,color:'#64748B',letterSpacing:1.5,textTransform:'uppercase'}}>{label}</span>
      </div>
    </div>
  );
}


/* ── 1. ACADEMIC SEAL (from v1) — refined with flag colors ── */
function Mark1(bg) {
  const textFill = bg === 'dark' ? C.light : C.deepBlue;
  return (
    <g>
      <circle cx="100" cy="100" r="90" fill="none" stroke={C.deepBlue} strokeWidth="2.5"/>
      <circle cx="100" cy="100" r="82" fill="none" stroke={C.skyBlue} strokeWidth="1"/>
      <defs>
        <path id={`topA-${bg}`} d="M 100,100 m -76,0 a 76,76 0 1,1 152,0" />
        <path id={`botA-${bg}`} d="M 24,100 a 76,76 0 0,0 152,0" />
      </defs>
      <text fontFamily="Cormorant Garamond,serif" fontSize="7.5" fontWeight="600" fill={C.deepBlue} letterSpacing="1.5">
        <textPath href={`#topA-${bg}`} startOffset="50%" textAnchor="middle">INTERNATIONAL ASSOCIATION FOR MONGOLIC LINGUISTICS</textPath>
      </text>
      <text fontFamily="DM Sans,sans-serif" fontSize="5.5" fill={C.skyBlue} letterSpacing="1">
        <textPath href={`#botA-${bg}`} startOffset="50%" textAnchor="middle">★ FOUNDED MMXXVI ★</textPath>
      </text>
      <text x="100" y="102" textAnchor="middle" fontFamily="Cormorant Garamond,serif" fontSize="36" fontWeight="700" fill={C.deepBlue} letterSpacing="3">IAML</text>
      <line x1="60" y1="112" x2="140" y2="112" stroke={C.gold} strokeWidth="1"/>
      <circle cx="57" cy="112" r="1.5" fill={C.gold}/>
      <circle cx="143" cy="112" r="1.5" fill={C.gold}/>
      {/* Script accent top */}
      <g transform="translate(100,55)">
        <line x1="0" y1="-10" x2="0" y2="12" stroke={C.red} strokeWidth="1.5"/>
        <circle cx="0" cy="-12" r="2" fill={C.red}/>
        <line x1="-4" y1="-2" x2="0" y2="2" stroke={C.red} strokeWidth="1"/>
      </g>
    </g>
  );
}


/* ── 2. ETERNAL BLUE SKY (from v1) — refined ── */
function Mark2(bg) {
  return (
    <g>
      <defs>
        <linearGradient id={`sky-${bg}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={C.lightSky}/>
          <stop offset="100%" stopColor={C.deepBlue}/>
        </linearGradient>
      </defs>
      <path d="M 30,108 Q 100,28 170,108" fill="none" stroke={`url(#sky-${bg})`} strokeWidth="4" strokeLinecap="round"/>
      <path d="M 42,108 Q 100,42 158,108" fill="none" stroke={C.lightSky} strokeWidth="1.5" opacity="0.35" strokeLinecap="round"/>
      <circle cx="100" cy="68" r="7" fill={C.gold}/>
      <circle cx="100" cy="68" r="10" fill="none" stroke={C.gold} strokeWidth="0.6" opacity="0.4"/>
      <text x="100" y="138" textAnchor="middle" fontFamily="Cormorant Garamond,serif" fontSize="32" fontWeight="700" fill={bg==='dark'?C.light:C.deepBlue} letterSpacing="6">IAML</text>
      <text x="100" y="158" textAnchor="middle" fontFamily="DM Sans,sans-serif" fontSize="6" fill={C.skyBlue} letterSpacing="2">THE INTERNATIONAL ASSOCIATION</text>
      <text x="100" y="168" textAnchor="middle" fontFamily="DM Sans,sans-serif" fontSize="6" fill={C.skyBlue} letterSpacing="2">FOR MONGOLIC LINGUISTICS</text>
    </g>
  );
}


/* ── 3. GOLDEN EAGLE — iconic silhouette in flag colors ── */
function Mark3(bg) {
  return (
    <g>
      <path d="
        M 100,30
        C 96,30 91,33 89,37
        C 87,41 87,45 89,47
        L 87,47
        C 80,47 64,53 48,70
        C 40,80 36,88 38,92
        C 40,95 43,95 48,92
        C 55,87 64,78 74,73
        L 70,78
        C 65,87 62,99 63,106
        C 65,111 68,112 71,110
        C 76,107 81,98 85,90
        L 87,85
        C 89,95 90,109 89,122
        C 87,132 86,138 86,142
        C 86,145 88,147 91,147
        C 95,147 97,142 99,135
        C 101,142 103,147 107,147
        C 110,147 112,145 112,142
        C 112,138 111,132 109,122
        C 108,109 109,95 111,85
        L 113,90
        C 117,98 122,107 127,110
        C 130,112 133,111 135,106
        C 137,99 133,87 128,78
        L 124,73
        C 134,78 143,87 150,92
        C 155,95 158,95 160,92
        C 162,88 158,80 150,70
        C 134,53 118,47 111,47
        L 109,47
        C 111,45 111,41 109,37
        C 107,33 102,30 100,30 Z
      " fill={C.deepBlue}/>
      {/* Gold eye */}
      <circle cx="96" cy="39" r="2" fill={C.gold}/>
      {/* Red accent — breast mark */}
      <circle cx="100" cy="110" r="4" fill={C.red} opacity="0.7"/>
    </g>
  );
}


/* ── 4. MODERN ULZII KNOT — flag colors ── */
function Mark4(bg) {
  const bgColor = bg === 'dark' ? C.dark : '#ffffff';
  return (
    <g>
      {/* Outer frame */}
      <rect x="40" y="40" width="120" height="120" rx="16" fill={C.deepBlue}/>
      
      {/* Knot pattern — cut out in gold */}
      {/* Horizontal bars */}
      <rect x="52" y="74" width="96" height="11" rx="5.5" fill={C.gold}/>
      <rect x="52" y="115" width="96" height="11" rx="5.5" fill={C.gold}/>
      
      {/* Vertical bars */}
      <rect x="64" y="52" width="11" height="96" rx="5.5" fill={C.gold}/>
      <rect x="125" y="52" width="11" height="96" rx="5.5" fill={C.gold}/>
      
      {/* Corner fills */}
      <rect x="52" y="52" width="23" height="23" rx="10" fill={C.gold}/>
      <rect x="125" y="52" width="23" height="23" rx="10" fill={C.gold}/>
      <rect x="52" y="125" width="23" height="23" rx="10" fill={C.gold}/>
      <rect x="125" y="125" width="23" height="23" rx="10" fill={C.gold}/>
      
      {/* Center weave cutout */}
      <rect x="75" y="85" width="50" height="30" rx="4" fill={C.deepBlue}/>
      
      {/* Center diamond */}
      <rect x="94" y="94" width="12" height="12" rx="2" fill={C.red} transform="rotate(45,100,100)"/>
    </g>
  );
}


/* ── 5. SCRIPT TOWER / STELE — blue & gold ── */
function Mark5(bg) {
  return (
    <g>
      {/* Main stele form */}
      <path d="
        M 76,174
        L 76,62
        C 76,34 100,18 100,18
        C 100,18 124,34 124,62
        L 124,174
        Z
      " fill={C.deepBlue}/>
      {/* Arch window */}
      <path d="
        M 88,174
        L 88,108
        C 88,92 100,84 100,84
        C 100,84 112,92 112,108
        L 112,174
        Z
      " fill={bg === 'dark' ? C.dark : '#ffffff'}/>
      {/* Gold inscription marks */}
      <rect x="84" y="52" width="32" height="2.5" rx="1.25" fill={C.gold} opacity="0.7"/>
      <rect x="88" y="60" width="24" height="2.5" rx="1.25" fill={C.gold} opacity="0.7"/>
      <rect x="90" y="68" width="20" height="2.5" rx="1.25" fill={C.gold} opacity="0.7"/>
      {/* Red dot accent */}
      <circle cx="100" cy="44" r="3" fill={C.red}/>
    </g>
  );
}


/* ── 6. SCRIPT ACCENT WORDMARK (from v1) — refined ── */
function Mark6(bg) {
  return (
    <g>
      {/* Vertical Mongolian script-inspired line */}
      <g transform="translate(38,20)">
        <line x1="0" y1="0" x2="0" y2="160" stroke={C.skyBlue} strokeWidth="2.5"/>
        <circle cx="0" cy="4" r="4" fill={C.red}/>
        <path d="M 0,30 Q -10,40 0,52" fill="none" stroke={C.skyBlue} strokeWidth="2" strokeLinecap="round"/>
        <path d="M 0,68 Q 8,78 0,90" fill="none" stroke={C.skyBlue} strokeWidth="2" strokeLinecap="round"/>
        <path d="M 0,106 Q -7,113 -3,122 Q 0,130 0,136" fill="none" stroke={C.skyBlue} strokeWidth="2" strokeLinecap="round"/>
        <circle cx="-3" cy="122" r="1.5" fill={C.skyBlue}/>
        <line x1="-3" y1="160" x2="3" y2="160" stroke={C.skyBlue} strokeWidth="2" strokeLinecap="round"/>
      </g>
      
      {/* Main wordmark */}
      <text x="58" y="100" fontFamily="Libre Baskerville,serif" fontSize="42" fontWeight="700" fill={bg==='dark'?C.light:C.deepBlue} letterSpacing="4">IAML</text>
      
      {/* Gold separator */}
      <line x1="58" y1="114" x2="180" y2="114" stroke={C.gold} strokeWidth="1.2"/>
      
      {/* Subtitle */}
      <text x="58" y="132" fontFamily="DM Sans,sans-serif" fontSize="6.5" fill={C.skyBlue} letterSpacing="1.5">THE INTERNATIONAL ASSOCIATION</text>
      <text x="58" y="143" fontFamily="DM Sans,sans-serif" fontSize="6.5" fill={C.skyBlue} letterSpacing="1.5">FOR MONGOLIC LINGUISTICS</text>
    </g>
  );
}


/* ── 7. GER SILHOUETTE — with flag colors ── */
function Mark7(bg) {
  return (
    <g>
      {/* Toono (crown wheel) */}
      <circle cx="100" cy="48" r="12" fill="none" stroke={C.deepBlue} strokeWidth="4"/>
      <circle cx="100" cy="48" r="3.5" fill={C.gold}/>
      
      {/* Roof fill */}
      <path d="
        M 36,124
        C 36,124 58,74 100,66
        C 142,74 164,124 164,124
        Z
      " fill={C.deepBlue} opacity="0.1"/>
      
      {/* Roof stroke */}
      <path d="
        M 100,60 L 100,66
        M 36,124
        C 36,124 58,74 100,66
        C 142,74 164,124 164,124
      " fill="none" stroke={C.deepBlue} strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round"/>
      
      {/* Walls */}
      <line x1="34" y1="124" x2="34" y2="164" stroke={C.deepBlue} strokeWidth="4.5" strokeLinecap="round"/>
      <line x1="166" y1="124" x2="166" y2="164" stroke={C.deepBlue} strokeWidth="4.5" strokeLinecap="round"/>
      <line x1="30" y1="164" x2="170" y2="164" stroke={C.deepBlue} strokeWidth="4.5" strokeLinecap="round"/>
      
      {/* Red door frame */}
      <rect x="86" y="130" width="28" height="34" rx="3" fill="none" stroke={C.red} strokeWidth="2.5"/>
      
      {/* Gold script line inside door */}
      <line x1="100" y1="136" x2="100" y2="158" stroke={C.gold} strokeWidth="2" strokeLinecap="round"/>
      <circle cx="100" cy="134" r="2" fill={C.gold}/>
    </g>
  );
}


/* ── 8. HORIZON + SKY ARC — steppe colors ── */
function Mark8(bg) {
  return (
    <g>
      <defs>
        <linearGradient id={`hz-${bg}`} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={C.lightSky}/>
          <stop offset="100%" stopColor={C.deepBlue}/>
        </linearGradient>
      </defs>
      {/* Sky arc */}
      <path d="M 24,130 C 24,130 52,38 100,38 C 148,38 176,130 176,130" fill="none" stroke={`url(#hz-${bg})`} strokeWidth="5.5" strokeLinecap="round"/>
      
      {/* Horizon line */}
      <line x1="24" y1="130" x2="176" y2="130" stroke={C.deepBlue} strokeWidth="5.5" strokeLinecap="round"/>
      
      {/* Gold sun at apex */}
      <circle cx="100" cy="54" r="6" fill={C.gold}/>
      
      {/* Vertical script stroke */}
      <line x1="100" y1="130" x2="100" y2="90" stroke={C.red} strokeWidth="4.5" strokeLinecap="round"/>
      <circle cx="100" cy="85" r="4" fill={C.red}/>
      {/* Tooth */}
      <line x1="104" y1="106" x2="112" y2="102" stroke={C.red} strokeWidth="3" strokeLinecap="round"/>
    </g>
  );
}


function App() {
  return (
    <DesignCanvas title="IAML — Logo Concepts v4" subtitle="Mongolian flag & sky colors · light + dark previews">
      <DCSection id="seals" title="Seals & Wordmarks">
        <DCArtboard id="m1" label="Academic Seal" width={640} height={540}>
          <Dual label="Academic Seal">{Mark1}</Dual>
        </DCArtboard>
        <DCArtboard id="m2" label="Eternal Blue Sky" width={640} height={540}>
          <Dual label="Eternal Blue Sky">{Mark2}</Dual>
        </DCArtboard>
        <DCArtboard id="m6" label="Script Accent Wordmark" width={640} height={540}>
          <Dual label="Script Accent Wordmark">{Mark6}</Dual>
        </DCArtboard>
      </DCSection>

      <DCSection id="heritage" title="Mongolian Heritage">
        <DCArtboard id="m3" label="Golden Eagle" width={640} height={540}>
          <Dual label="Golden Eagle">{Mark3}</Dual>
        </DCArtboard>
        <DCArtboard id="m4" label="Ulzii Knot" width={640} height={540}>
          <Dual label="Ulzii Knot">{Mark4}</Dual>
        </DCArtboard>
        <DCArtboard id="m7" label="Ger Silhouette" width={640} height={540}>
          <Dual label="Ger Silhouette">{Mark7}</Dual>
        </DCArtboard>
      </DCSection>

      <DCSection id="symbolic" title="Symbolic Marks">
        <DCArtboard id="m5" label="Script Tower" width={640} height={540}>
          <Dual label="Script Tower">{Mark5}</Dual>
        </DCArtboard>
        <DCArtboard id="m8" label="Horizon Line" width={640} height={540}>
          <Dual label="Horizon Line">{Mark8}</Dual>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
