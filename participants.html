<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="assets/js/i18n.js?v=20261028-1"></script>
<title data-i18n>Participants — IAML</title>
<meta name="description" content="Members of the International Association for Mongolic Linguistics, listed by position." data-i18n-attr="content"/>
<meta name="theme-color" content="#003F87"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="manifest" href="site.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="iaml-site.css?v=20261028-1"/>
<style>h1,h2,h3,h4{font-family:'Cormorant Garamond','Noto Serif',serif;}</style>
</head>
<body data-page="participants">
<div id="site-header"></div>
<main>
  <header class="page-head"><div class="container">
    <div class="slabel" data-i18n>Community</div>
    <h1 data-i18n>Participants</h1>
    <p data-i18n>Members of the IAML community, grouped by position. Managed by the association.</p>
  </div></header>

  <section class="section"><div class="container">
    <!-- Roster from the members file (rendered by pages.js; Phase B swaps the array for a database fetch) -->
    <div id="participants-list">
      <noscript><p>Please enable JavaScript to view the members roster.</p></noscript>
    </div>
  </div></section>

  <section class="section section--alt"><div class="container">
    <div class="join-card contact-admin">
      <div>
        <h3 style="margin-bottom:10px" data-i18n>Contact the membership admin</h3>
        <p class="section__lead" style="margin:0" data-i18n>Questions about membership or your listing? Send a message to the association.</p>
      </div>
      <form class="cform" data-gated novalidate>
        <label><span data-i18n>Your name</span><input type="text" name="name" required/></label>
        <label><span data-i18n>Email</span><input type="email" name="email" required/></label>
        <label><span data-i18n>Message</span><textarea name="message" rows="4" required></textarea></label>
        <button class="btn btn--p" type="submit" data-i18n>Send message</button>
        <p class="cform__msg" data-form-msg></p>
      </form>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script defer src="assets/js/i18n-mn.js?v=20261028-1"></script>
<script defer src="assets/js/api.js?v=20261028-1"></script>
<script defer src="assets/js/app.js?v=20261028-1"></script>
<script defer src="assets/js/pages.js?v=20261028-1"></script>
<script defer src="assets/js/auth.js?v=20261028-1"></script>
</body>
</html>
