<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<script src="assets/js/i18n.js?v=20261028-1"></script>
<title data-i18n>Contacts — IAML</title>
<meta name="description" content="Contact the International Association for Mongolic Linguistics." data-i18n-attr="content"/>
<meta name="theme-color" content="#003F87"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="manifest" href="site.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="iaml-site.css?v=20261028-1"/>
<style>h1,h2,h3,h4{font-family:'Cormorant Garamond','Noto Serif',serif;}</style>
</head>
<body data-page="contacts">
<div id="site-header"></div>
<main>
  <header class="page-head"><div class="container">
    <div class="slabel" data-i18n>Get in touch</div>
    <h1 data-i18n>Contacts</h1>
    <p data-i18n>Questions, proposals, or media enquiries — send us a message.</p>
  </div></header>

  <section class="section"><div class="container">
    <div class="contacts__grid">
      <form class="cform cform--card" id="contactForm" data-gated novalidate>
        <h3 data-i18n>Send a message</h3>
        <div class="auth__row">
          <label><span data-i18n>Your name</span><input type="text" name="name" required/></label>
          <label><span data-i18n>Email</span><input type="email" name="email" required/></label>
        </div>
        <label><span data-i18n>Subject</span><input type="text" name="subject"/></label>
        <label><span data-i18n>Message</span><textarea name="message" rows="6" required></textarea></label>
        <button class="btn btn--p" type="submit" data-i18n>Send message</button>
        <p class="cform__msg" data-form-msg></p>
      </form>

      <!-- People & e-mails come from GET /api/contacts (CONTACT_PEOPLE in pages.js is the static fallback) -->
      <div class="contacts__people" id="contacts-people"></div>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script defer src="assets/js/i18n-mn.js?v=20261028-1"></script>
<script defer src="assets/js/api.js?v=20261028-1"></script>
<script defer src="assets/js/app.js?v=20261028-1"></script>
<script defer src="assets/js/pages.js?v=20261028-1"></script>
<script defer src="assets/js/auth.js?v=20261028-1"></script>
</body>
</html>
