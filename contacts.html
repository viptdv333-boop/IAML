<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contacts — IAML</title>
<meta name="description" content="Contact the International Association for Mongolic Linguistics."/>
<meta name="theme-color" content="#003F87"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="manifest" href="site.webmanifest"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="iaml-site.css?v=20260919-7"/>
<style>h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;}</style>
</head>
<body data-page="contacts">
<div id="site-header"></div>
<main>
  <header class="page-head"><div class="container">
    <div class="slabel">Get in touch</div>
    <h1>Contacts</h1>
    <p>Questions, proposals, or media enquiries — send us a message.</p>
  </div></header>

  <section class="section"><div class="container">
    <div class="contacts__grid">
      <form class="cform cform--card" data-gated novalidate>
        <h3>Send a message</h3>
        <div class="auth__row">
          <label>Your name<input type="text" name="name" required/></label>
          <label>Email<input type="email" name="email" required/></label>
        </div>
        <label>Subject<input type="text" name="subject"/></label>
        <label>Message<textarea name="message" rows="6" required></textarea></label>
        <button class="btn btn--p" type="submit">Send message</button>
        <p class="cform__msg" data-form-msg></p>
      </form>

      <!-- Phase F: people & emails come from the backend; see CONTACT_PEOPLE in pages.js -->
      <div class="contacts__people" id="contacts-people"></div>
    </div>
  </div></section>
</main>
<div id="site-footer"></div>
<script src="assets/js/supabaseClient.js?v=20260919-7"></script>
<script src="assets/js/app.js?v=20260919-7"></script>
<script src="assets/js/pages.js?v=20260919-7"></script>
</body>
</html>
